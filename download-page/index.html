<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BabyBloom</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .download {
      display: inline-block;
      padding: 15px 30px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .download:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>BabyBloom</h1>

    <p>Download the latest Android app</p>

    <a class="download" href="./app-release.apk" download>
      Download APK
    </a>
  </div>

</html>
